services:
  - type: web
    name: task-agent
    runtime: docker
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task-agent-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: task-agent-db
    plan: free
    databaseName: taskagent
